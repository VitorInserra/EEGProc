name: Tests

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast job: proves the base install needs no TensorFlow. A TF regression must
  # never be able to block a featurization change.
  base:
    name: base install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install base package only
        run: |
          python -m pip install -U pip
          pip install ".[dev]"

      - name: Assert TensorFlow is absent
        run: |
          if python -c "import tensorflow" 2>/dev/null; then
            echo "::error::TensorFlow is installed in the base environment; an extra has leaked into core dependencies."
            exit 1
          fi
          echo "TensorFlow correctly absent from the base install."

      - name: Run TensorFlow-free tests
        run: |
          pytest src/tests -v --no-cov \
            --ignore=src/tests/test_cross_validation.py

  # Full job: the cross-validation stack.
  deep-learning:
    name: deep-learning extra (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install with the deep-learning extra
        run: |
          python -m pip install -U pip
          pip install ".[deep-learning,dev]"

      - name: Run the full suite with coverage
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: |
          pytest src/tests -v \
            --cov=eegproc --cov-config=.coveragerc \
            --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Guards the packaging defects fixed in v2 so they cannot regress.
  packaging:
    name: wheel contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install -U pip build
          python -m build --wheel --outdir dist .

      - name: Assert the wheel ships only eegproc
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          tops = {n.split("/", 1)[0] for n in zipfile.ZipFile(wheel).namelist()}
          tops = {t for t in tops if not t.endswith(".dist-info")}
          print("top-level entries:", sorted(tops))
          if tops != {"eegproc"}:
              print(f"::error::wheel ships unexpected top-level entries: {sorted(tops - {'eegproc'})}")
              sys.exit(1)
          print("wheel ships only the eegproc package.")
          PY
